<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>CONVOY — Join</title>
  <meta name="description" content="A community built for creators and admirers of art.">
  <link rel="icon" type="image/png" href="./assets/convoy-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; background: #f7f6f3; }
    * { box-sizing: border-box; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: #6E1423; }
    ::selection { background: #6E1423; color: #ffffff; }
    input::placeholder { color: rgba(10,10,10,0.35); }
    input:focus { outline: none; }
    #bg-video::-webkit-media-controls, #bg-video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
  </style>
</helmet>

<div style="font-family: 'EB Garamond', 'Times New Roman', serif; font-size: 15px; line-height: 1.75; color: #0a0a0a; background: #f7f6f3; overflow-x: hidden; min-height: 100svh; display: flex; flex-direction: column;">
  <nav style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 24px; padding: 20px clamp(20px, 5vw, 64px);">
      <a href="Convoy.dc.html" style="display: flex; align-items: center; min-height: 44px; flex: 1 0 90px;"><img src="./assets/convoy-logo-black.png" alt="Convoy" style="height: 20px; width: auto; display: block;"></a>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0 clamp(18px, 3vw, 44px); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;">
        <a href="About.dc.html" style="color: #0a0a0a; padding: 12px 0 5px; border-bottom: 1px solid transparent;" style-hover="color: #6E1423; border-bottom-color: #6E1423;">About</a>
        <a href="Gallery.dc.html" style="color: #0a0a0a; padding: 12px 0 5px; border-bottom: 1px solid transparent;" style-hover="color: #6E1423; border-bottom-color: #6E1423;">Gallery</a>
        <a href="https://events.humanitix.com/whatisartnostalgia" style="color: #0a0a0a; padding: 12px 0 5px; border-bottom: 1px solid transparent;" style-hover="color: #6E1423; border-bottom-color: #6E1423;">Events</a>
        <a href="Join.dc.html" style="color: #0a0a0a; padding: 12px 0 5px; border-bottom: 1px solid #0a0a0a;" style-hover="color: #6E1423; border-bottom-color: #6E1423;">Join</a>
      </div>
      <div style="flex: 1 0 90px; height: 0;"></div>
    </nav>
  <section id="join" data-screen-label="Join" style="background: #f7f6f3; color: #0a0a0a; flex: 1; padding: clamp(48px, 8vw, 110px) clamp(20px, 5vw, 64px) clamp(80px, 12vw, 160px);">
    <div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: clamp(40px, 6vw, 80px);">Join</div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(56px, 8vw, 120px); align-items: start;">
      <div>
        <h2 style="font-weight: 500; font-size: clamp(52px, 9vw, 144px); line-height: 0.88; letter-spacing: -0.03em; margin: 0 0 clamp(28px, 4vw, 48px);">CONVOY</h2>
        <p style="margin: 0; max-width: 260px;">Stay updated with announcements for exclusive pricing &amp; community events.<br><br></p>
      </div>

      <div style="max-width: 520px; width: 100%;">
        <sc-if value="{{ joinSent }}" hint-placeholder-val="{{ false }}">
          <div style="border-top: 1px solid #0a0a0a; padding-top: 32px; display: flex; flex-direction: column; gap: 18px;">
            <img src="./assets/convoy-logo-black.png" alt="Convoy" style="width: 120px; height: auto; display: block;">
            <div style="font-weight: 800; font-size: clamp(40px, 6vw, 72px); line-height: 0.9; letter-spacing: -0.02em;">You're in.</div>
            <p style="margin: 0;">Welcome to the CONVOY community!<br><br></p>
          </div>
        </sc-if>
        <sc-if value="{{ joinOpen }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submitJoin }}" action="https://formspree.io/f/maeoepbn" method="POST" style="display: flex; flex-direction: column; gap: 34px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 34px 28px;">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;">First name
                <input name="first-name" required="required" autocomplete="given-name" style="width: 100%; min-height: 44px; padding: 6px 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(10,10,10,0.35); border-radius: 0; color: #0a0a0a; font-family: inherit; font-size: 24px; line-height: 1.2;" style-focus="border-bottom-color: #6E1423;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;">Last name
                <input name="last-name" required="required" autocomplete="family-name" style="width: 100%; min-height: 44px; padding: 6px 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(10,10,10,0.35); border-radius: 0; color: #0a0a0a; font-family: inherit; font-size: 24px; line-height: 1.2;" style-focus="border-bottom-color: #6E1423;">
              </label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;">Email
              <input type="email" name="email" required="required" autocomplete="email" style="width: 100%; min-height: 44px; padding: 6px 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(10,10,10,0.35); border-radius: 0; color: #0a0a0a; font-family: inherit; font-size: 24px; line-height: 1.2;" style-focus="border-bottom-color: #6E1423;">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;">Phone
              <input type="tel" name="mobile" required="required" autocomplete="tel" placeholder="+61" style="width: 100%; min-height: 44px; padding: 6px 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(10,10,10,0.35); border-radius: 0; color: #0a0a0a; font-family: inherit; font-size: 24px; line-height: 1.2;" style-focus="border-bottom-color: #6E1423;">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;">Your art form
              <input name="art-form" required="required" placeholder="Painting, music, film…" style="width: 100%; min-height: 44px; padding: 6px 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(10,10,10,0.35); border-radius: 0; color: #0a0a0a; font-family: inherit; font-size: 24px; line-height: 1.2;" style-focus="border-bottom-color: #6E1423;">
            </label>
            <button type="submit" disabled="{{ sending }}" style="align-self: flex-start; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; background: #0a0a0a; color: #ffffff; border: 1px solid #0a0a0a; border-radius: 0; padding: 17px 44px; margin-top: 6px;" style-hover="background: #6E1423; border-color: #6E1423;">{{ submitLabel }}</button>
            <sc-if value="{{ joinError }}" hint-placeholder-val="{{ false }}">
              <div style="font-weight: 700; color: #6E1423;">That didn't send. Try again, or message <a href="https://www.instagram.com/convoy.au" target="_blank" rel="noopener" style="border-bottom: 1px solid #6E1423;">@convoy.au</a>.</div>
            </sc-if>
          </form>
        </sc-if>
      </div>
    </div>
  </section>
  <footer style="background: #0a0a0a; color: #ffffff; border-top: 1px solid rgba(255,255,255,0.18); padding: 34px clamp(20px, 5vw, 64px); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px 32px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;">
    <img src="./assets/convoy-logo-white.png" alt="Convoy" style="height: 18px; width: auto; display: block;">
    <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;"><span>Get in contact with us here!</span><a href="mailto:info@convoyevents.au" style="color: #ffffff; font-weight: 700; letter-spacing: 0.04em; text-transform: none; font-size: 15px; padding-bottom: 3px; border-bottom: 1px solid #ffffff;" style-hover="border-bottom-color: #6E1423;">info@convoyevents.au</a></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 28px;"><a href="https://www.instagram.com/convoy.au/" target="_blank" rel="noopener" style="color: #ffffff; padding-bottom: 4px; border-bottom: 1px solid transparent;" style-hover="border-bottom-color: #6E1423;">Instagram</a><span>© 2026 Convoy</span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { joinStatus: 'open' };

  submitJoin = async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    if (this.state.joinStatus === 'sending') return;
    this.setState({ joinStatus: 'sending' });
    try {
      const res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('bad status');
      this.setState({ joinStatus: 'sent' });
    } catch (err) {
      this.setState({ joinStatus: 'error' });
    }
  };

  renderVals() {
    const s = this.state.joinStatus;
    return { joinSent: s === 'sent', joinOpen: s !== 'sent', joinError: s === 'error', sending: s === 'sending', submitLabel: s === 'sending' ? 'Sending' : 'Join', submitJoin: this.submitJoin };
  }
}
</script>
</body>
</html>
