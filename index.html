<script type="text/x-dc" data-dc-script data-props="{&quot;heroVideo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this.kickVideo(); }
  componentDidUpdate() { this.kickVideo(); }

  kickVideo() {
    const v = document.getElementById('bg-video');
    if (!v || v._kicked) return;
    v._kicked = true;
    v.muted = true; v.defaultMuted = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    const tryPlay = () => { if (!v.paused) return; v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); };
    tryPlay();
    v.addEventListener('canplay', tryPlay);
    const evs = ['touchstart', 'pointerdown', 'scroll', 'keydown'];
    evs.forEach(e => document.addEventListener(e, tryPlay, { passive: true }));
    v.addEventListener('playing', () => evs.forEach(e => document.removeEventListener(e, tryPlay)), { once: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
  }

  renderVals() { return { showVideo: this.props.heroVideo ?? true }; }
}
</script>
