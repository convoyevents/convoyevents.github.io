<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const h = (location.hash || '').slice(1);
    if (h === 'events' || h === 'auction') location.replace('https://events.humanitix.com/what-is-art-masquerade');

    const v = document.getElementById('bg-video');
    if (!v) return;

    // Frameworks often drop the `muted` attribute when rendering; browsers only
    // allow autoplay for muted video, so force it as both property and attribute.
    v.muted = true;
    v.defaultMuted = true;
    v.playsInline = true;
    v.setAttribute('muted', '');
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');

    const tryPlay = () => {
      if (!v.paused) return;
      v.muted = true;
      const p = v.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    };

    // 1. Try straight away, and again once the video has data
    tryPlay();
    v.addEventListener('loadedmetadata', tryPlay);
    v.addEventListener('canplay', tryPlay);

    // 2. If the browser blocked autoplay, start on the first interaction of any kind
    const interactionEvents = ['touchstart', 'pointerdown', 'click', 'scroll', 'keydown'];
    interactionEvents.forEach(e => document.addEventListener(e, tryPlay, { passive: true }));
    v.addEventListener('playing', () => {
      interactionEvents.forEach(e => document.removeEventListener(e, tryPlay));
    }, { once: true });

    // 3. Resume after switching tabs/apps, or returning via the back button
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
    window.addEventListener('pageshow', tryPlay);

    // 4. Some mobile browsers pause the video on their own; nudge it back
    v.addEventListener('pause', () => { if (!document.hidden) setTimeout(tryPlay, 300); });
  }
  renderVals() { return {}; }
}
</script>
