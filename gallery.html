<!DOCTYPE html>
<html>
<head>
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1074129428626307');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1074129428626307&ev=PageView&noscript=1"
/></noscript>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>CONVOY — Gallery</title>
  <meta name="description" content="A community built for creators and admirers of art.">
  <link rel="icon" type="image/png" href="./assets/convoy-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; background: #0a0a0a; }
    * { box-sizing: border-box; }
    image-slot { pointer-events: none !important; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: #6E1423; }
    ::selection { background: #6E1423; color: #ffffff; }
    input::placeholder { color: rgba(10,10,10,0.35); }
    input:focus { outline: none; }
    #bg-video::-webkit-media-controls, #bg-video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
  </style>
</helmet>

<div style="font-family: 'EB Garamond', 'Times New Roman', serif; font-size: 15px; line-height: 1.75; color: #ffffff; background: #0a0a0a; overflow-x: hidden; min-height: 100svh; display: flex; flex-direction: column;">
  <nav style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 24px; padding: 20px clamp(20px, 5vw, 64px);">
      <a href="./" style="display: flex; align-items: center; min-height: 44px; flex: 1 0 90px;"><img src="./assets/convoy-logo-white.png" alt="Convoy" style="height: 20px; width: auto; display: block;"></a>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0 clamp(18px, 3vw, 44px); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;">
        <a href="about" style="color: #ffffff; padding: 12px 0 5px; border-bottom: 1px solid transparent;" style-hover="border-bottom-color: #6E1423;">About</a>
        <a href="gallery" style="color: #ffffff; padding: 12px 0 5px; border-bottom: 1px solid #ffffff;" style-hover="border-bottom-color: #6E1423;">Gallery</a>
        <a href="https://events.humanitix.com/whatisartnostalgia" style="color: #ffffff; padding: 12px 0 5px; border-bottom: 1px solid transparent;" style-hover="border-bottom-color: #6E1423;">Events</a>
        <a href="join" style="color: #ffffff; padding: 12px 0 5px; border-bottom: 1px solid transparent;" style-hover="border-bottom-color: #6E1423;">Join</a>
      </div>
      <div style="flex: 1 0 90px; height: 0;"></div>
    </nav>
  <section id="gallery" data-screen-label="Gallery" style="background: #0a0a0a; color: #ffffff; flex: 1; padding: clamp(48px, 8vw, 110px) clamp(20px, 5vw, 64px) clamp(80px, 12vw, 160px);">
    <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: clamp(40px, 6vw, 80px);">
      <div>Gallery</div>
      <a href="https://www.instagram.com/convoy.au/" target="_blank" rel="noopener" style="color: #ffffff; padding-bottom: 4px; border-bottom: 1px solid transparent;" style-hover="border-bottom-color: #6E1423;">@convoy.au</a>
    </div>
    <h2 style="font-weight: 500; font-size: clamp(52px, 10.5vw, 168px); line-height: 0.88; letter-spacing: -0.03em; margin: 0 0 clamp(64px, 10vw, 140px);">The nights.</h2>
    <div style="columns: 3 260px; column-gap: clamp(16px, 2.4vw, 36px);">
      <sc-for list="{{ shots }}" as="s" hint-placeholder-count="7">
        <div style="break-inside: avoid; margin-bottom: clamp(16px, 2.4vw, 36px); width: 100%; aspect-ratio: {{ s.ratio }}; background: #161616;">
          <image-slot id="{{ s.id }}" shape="rect" placeholder="{{ s.label }}" style="width: 100%; height: 100%;"></image-slot>
        </div>
      </sc-for>
    </div>
  </section>
  <footer style="background: #0a0a0a; color: #ffffff; border-top: 1px solid rgba(255,255,255,0.18); padding: 34px clamp(20px, 5vw, 64px); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px 32px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;">
    <img src="./assets/convoy-logo-white.png" alt="Convoy" style="height: 18px; width: auto; display: block;">
    <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;"><span>Get in contact with us here!</span><a href="mailto:info@convoyevents.au" style="color: #ffffff; font-weight: 700; letter-spacing: 0.04em; text-transform: none; font-size: 15px; padding-bottom: 3px; border-bottom: 1px solid #ffffff;" style-hover="border-bottom-color: #6E1423;">info@convoyevents.au</a></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 28px;"><a href="https://www.instagram.com/convoy.au/" target="_blank" rel="noopener" style="color: #ffffff; padding-bottom: 4px; border-bottom: 1px solid transparent;" style-hover="border-bottom-color: #6E1423;">Instagram</a><span>© 2026 Convoy</span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;galleryCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:3,&quot;max&quot;:7,&quot;step&quot;:1,&quot;section&quot;:&quot;Gallery&quot;}}">
class Component extends DCLogic {
  shots = [
    { id: 'g1', ratio: '4 / 5', label: 'Photo — the crowd' },
    { id: 'g2', ratio: '3 / 2', label: 'Photo — live painting' },
    { id: 'g3', ratio: '1 / 1', label: 'Photo — the band' },
    { id: 'g4', ratio: '3 / 2', label: 'Photo — the room' },
    { id: 'g5', ratio: '4 / 5', label: 'Photo — a portrait' },
    { id: 'g6', ratio: '3 / 4', label: 'Photo — work on the wall' },
    { id: 'g7', ratio: '3 / 2', label: 'Photo — late in the night' },
  ];

  renderVals() { return { shots: this.shots.slice(0, this.props.galleryCount ?? 7) }; }
}
</script>
</body>
</html>
